[project]
name = "htb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "auri", email = "353008519+auri-ay@users.noreply.github.com" }
]
requires-python = ">=3.10,<=3.13"



dependencies = [
    "paddlepaddle",
    "paddleocr[doc-parser]>=3.4.0",
    "ipykernel>=7.3.0",
    "matplotlib",
    "transformers",
    "torchvision",
    "flask>=3.1.3",
]

[dependency-groups]
dev = [

]

[tool.uv.sources]
torch = {index = "pytorch"}
torchvision = {index = "pytorch"}
paddlepaddle = {index = "paddlepaddle"}


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/nightly/cpu/"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
