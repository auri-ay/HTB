<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lithology Extractor</title>
<style>
  :root {
    --space: #0b1b4a;
    --paper: #fdf6ff;
    --ink: #1a1030;
    --pink: #ff3399;
    --pink-soft: #ff99ff;
    --muted: #5b4b7a;
    --stripes: linear-gradient(to bottom,
      #ff0000 0 16.66%, #ff9900 0 33.33%, #ffff00 0 50%,
      #33ff00 0 66.66%, #0099ff 0 83.33%, #6633ff 0);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    font: 14px/1.45 Verdana, Tahoma, sans-serif;
    background-color: var(--space);
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 90px 80px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 140px 20px, #cdf 50%, transparent 51%),
      radial-gradient(1px 1px at 60px 130px, #fff 50%, transparent 51%);
    background-size: 160px 160px;
  }

  /* header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    border-bottom: 4px solid #000;
    background: var(--space);
  }
  h1 {
    margin: 0;
    font: bold 26px Trebuchet MS, Verdana, sans-serif;
    color: #fff;
    text-shadow: 3px 3px 0 var(--pink);
    white-space: nowrap;
  }
  .trail {
    flex: 1;
    height: 30px;
    background: var(--stripes);
    border-block: 2px solid #000;
  }
  .cat { width: 68px; margin-left: -16px; image-rendering: pixelated; animation: bob .5s steps(1) infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .cat { animation: none; } }

  /* layout */
  main {
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 20px;
    padding: 20px 24px;
    align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }

  .panel {
    margin-bottom: 20px;
    padding: 14px;
    background: var(--paper);
    border: 3px solid #000;
    box-shadow: 5px 5px 0 var(--pink);
  }
  h2 { margin: 0 0 10px; font: bold 15px Trebuchet MS, Verdana, sans-serif; }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 12px; }

  /* controls */
  button {
    font: inherit;
    padding: 4px 12px;
    color: var(--ink);
    background: #e6dcf5;
    border: 2px outset #fff;
    cursor: pointer;
  }
  button:active { border-style: inset; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--pink); outline-offset: 1px; }
  button.active { background: var(--pink-soft); font-weight: bold; }
  button.run { background: var(--pink); color: #fff; font-weight: bold; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

  .file {
    display: block;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    border: 2px dashed var(--muted);
    cursor: pointer;
  }
  .file input { display: none; }

  .box { display: grid; grid-template-columns: 76px repeat(4, 1fr); gap: 4px; align-items: center; margin-bottom: 4px; }
  .box input {
    width: 100%;
    padding: 3px 4px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 2px inset #ccc;
  }

  .error { margin-left: 8px; color: #c00000; }

  /* preview */
  .scroll { max-height: 620px; overflow: auto; background: #fff; border: 2px inset #ccc; }
  .canvas { position: relative; width: 800px; cursor: crosshair; user-select: none; }
  .canvas img { display: block; width: 800px; }
  .sel { position: absolute; border: 2px solid; pointer-events: none; }
  .sel span { position: absolute; top: -17px; left: -2px; padding: 0 4px; font-size: 11px; color: #fff; }

  /* results */
  .stats { display: flex; gap: 28px; margin-bottom: 10px; }
  .stats b { display: block; font-size: 20px; }
  .stats small { color: var(--muted); }
  .downloads { display: flex; gap: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 3px 8px; text-align: right; border-bottom: 1px solid #d8c9ee; }
  th { position: sticky; top: 0; background: #e6dcf5; }
  th:nth-child(3), td:nth-child(3) { text-align: left; }
  tbody tr:nth-child(even) { background: #f4eafc; }

  ul { margin: 0; padding-left: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Lithology Extractor</h1>
  <div class="trail"></div>
  <svg class="cat" viewBox="0 0 18 12" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="2" y="1" width="11" height="9" fill="#000"/>
    <rect x="3" y="2" width="9" height="7" fill="#ffcc99"/>
    <rect x="4" y="3" width="7" height="5" fill="#ff99ff"/>
    <rect x="5" y="4" width="1" height="1" fill="#ff3399"/>
    <rect x="9" y="3" width="1" height="1" fill="#ff3399"/>
    <rect x="8" y="6" width="1" height="1" fill="#ff3399"/>
    <rect x="5" y="7" width="1" height="1" fill="#ff3399"/>
    <rect x="11" y="3" width="6" height="6" fill="#000"/>
    <rect x="11" y="2" width="2" height="1" fill="#000"/>
    <rect x="15" y="2" width="2" height="1" fill="#000"/>
    <rect x="12" y="4" width="4" height="4" fill="#999"/>
    <rect x="12" y="5" width="1" height="1" fill="#000"/>
    <rect x="15" y="5" width="1" height="1" fill="#000"/>
    <rect x="13" y="7" width="2" height="1" fill="#ff99ff"/>
    <rect x="3" y="10" width="2" height="2" fill="#000"/>
    <rect x="9" y="10" width="2" height="2" fill="#000"/>
    <rect x="12" y="9" width="2" height="2" fill="#000"/>
  </svg>
</header>

<main>
  <section>
    <div class="panel">
      <h2>1. Document</h2>
      <label class="file">
        <input type="file" id="file-input" accept="image/*,.tif,.tiff">
        <span id="file-name">Choose an image (TIFF, PNG or JPG)</span>
      </label>
      <p class="hint" id="dims" hidden></p>
    </div>

    <div class="panel">
      <h2>2. Regions</h2>
      <div class="picker" id="picker"></div>
      <div id="boxes"></div>
      <div style="margin-top: 12px">
        <button class="run" id="run" disabled>Run</button>
        <span class="error" id="error"></span>
      </div>
    </div>

    <div class="panel" id="preview-panel" hidden>
      <h2>Preview</h2>
      <div class="scroll">
        <div class="canvas" id="canvas">
          <img id="preview" draggable="false" alt="Document preview">
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="panel" id="empty">
      <h2>Results</h2>
      <p class="hint">results displayed</p>
    </div>

    <div id="results" hidden>
      <div class="panel">
        <div class="stats">
          <div><b id="stat-count"></b><small>intervals</small></div>
          <div><b id="stat-time"></b><small>runtime</small></div>
          <div><b id="stat-mem"></b><small>peak memory</small></div>
        </div>
        <div class="downloads">
          <button id="dl-csv">Download CSV</button>
          <a id="dl-image" download="annotated_column.png"><button>Download annotated image</button></a>
        </div>
      </div>

      <div class="panel">
        <h2>Annotated column</h2>
        <div class="scroll"><img id="annotated" alt="Annotated lithology column" style="display: block"></div>
      </div>

      <div class="panel">
        <h2>Intervals</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr><th>top_y</th><th>bottom_y</th><th>lithology</th><th>cluster</th><th>top_depth</th><th>base_depth</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const PREVIEW_WIDTH = 800;
const COLUMNS = ['top_y', 'bottom_y', 'lithology', 'cluster_id', 'top_depth', 'base_depth'];
const REGIONS = [
  { key: 'lith',   label: 'Lithology', color: '#0b6e4f' },
  { key: 'depth',  label: 'Depth',     color: '#1f5fbf', optional: true },
  { key: 'legend', label: 'Legend',    color: '#b3541e', optional: true },
];

const state = {
  file: null,
  size: null,
  active: 'lith',
  boxes: { lith: [], depth: [], legend: [] },
};

const $ = id => document.getElementById(id);
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

const isValid = b => b.length === 4 && b.every(Number.isFinite) && b[2] > b[0] && b[3] > b[1];
const scale = () => (state.size ? state.size.width / PREVIEW_WIDTH : 1);

/* ---- region controls ---- */

const inputs = {};
const overlays = {};

function buildRegionControls() {
  for (const region of REGIONS) {
    const button = el('button', { textContent: region.label + (region.optional ? ' (optional)' : '') });
    button.addEventListener('click', () => { state.active = region.key; refresh(); });
    $('picker').append(button);
    region.button = button;

    const row = el('div', { className: 'box' }, el('span', { textContent: region.label }));
    inputs[region.key] = ['x0', 'y0', 'x1', 'y1'].map((name, i) => {
      const input = el('input', { type: 'number', placeholder: name });
      input.addEventListener('input', () => {
        state.boxes[region.key][i] = input.valueAsNumber;
        refresh({ skipInputs: true });
      });
      row.append(input);
      return input;
    });
    $('boxes').append(row);

    const label = el('span', { textContent: region.label });
    label.style.background = region.color;
    const overlay = el('div', { className: 'sel', hidden: true }, label);
    overlay.style.borderColor = region.color;
    $('canvas').append(overlay);
    overlays[region.key] = overlay;
  }
}

function refresh({ skipInputs = false } = {}) {
  const s = scale();
  for (const region of REGIONS) {
    const box = state.boxes[region.key];
    region.button.classList.toggle('active', state.active === region.key);

    if (!skipInputs) inputs[region.key].forEach((input, i) => { input.value = Number.isFinite(box[i]) ? box[i] : ''; });

    const overlay = overlays[region.key];
    overlay.hidden = !isValid(box);
    if (!overlay.hidden) {
      Object.assign(overlay.style, {
        left: box[0] / s + 'px',
        top: box[1] / s + 'px',
        width: (box[2] - box[0]) / s + 'px',
        height: (box[3] - box[1]) / s + 'px',
      });
    }
  }
  $('run').disabled = !(state.file && isValid(state.boxes.lith)) || $('run').dataset.busy === '1';
}

/* ---- dragging on the preview ---- */

let dragStart = null;

function pointerToImage(ev) {
  const rect = $('canvas').getBoundingClientRect();
  const s = scale();
  return [Math.round((ev.clientX - rect.left) * s), Math.round((ev.clientY - rect.top) * s)];
}

$('canvas').addEventListener('mousedown', ev => {
  dragStart = pointerToImage(ev);
  state.boxes[state.active] = [...dragStart, ...dragStart];
  refresh();
});

$('canvas').addEventListener('mousemove', ev => {
  if (!dragStart) return;
  const [x, y] = pointerToImage(ev);
  state.boxes[state.active] = [
    Math.min(dragStart[0], x), Math.min(dragStart[1], y),
    Math.max(dragStart[0], x), Math.max(dragStart[1], y),
  ];
  refresh();
});

for (const type of ['mouseup', 'mouseleave']) {
  $('canvas').addEventListener(type, () => { dragStart = null; });
}

/* ---- upload ---- */

$('file-input').addEventListener('change', async ev => {
  const file = ev.target.files[0];
  if (!file) return;

  state.file = file;
  $('file-name').textContent = file.name;
  $('error').textContent = '';
  showResults(null);

  const body = new FormData();
  body.append('image', file);

  try {
    const res = await fetch('/api/preview', { method: 'POST', body });
    if (!res.ok) throw new Error(await res.text());
    const { width, height, preview } = await res.json();

    state.size = { width, height };
    $('preview').src = preview;
    $('dims').textContent = `${width} × ${height} px`;
    $('dims').hidden = false;
    $('preview-panel').hidden = false;
    refresh();
  } catch (err) {
    $('error').textContent = 'Could not read image: ' + err.message;
  }
});

/* ---- pipeline ---- */

$('run').addEventListener('click', async () => {
  const run = $('run');
  run.dataset.busy = '1';
  run.disabled = true;
  run.textContent = 'Processing…';
  $('error').textContent = '';
  showResults(null);

  const optional = key => (isValid(state.boxes[key]) ? state.boxes[key] : null);
  const body = new FormData();
  body.append('image', state.file);
  body.append('bboxes', JSON.stringify({
    lith: state.boxes.lith,
    depth: optional('depth'),
    legend: optional('legend'),
  }));

  try {
    const res = await fetch('/api/process', { method: 'POST', body });
    if (!res.ok) throw new Error(await res.text());
    showResults(await res.json());
  } catch (err) {
    $('error').textContent = err.message;
  } finally {
    run.dataset.busy = '0';
    run.textContent = 'Run pipeline';
    refresh({ skipInputs: true });
  }
});

/* ---- results ---- */

let current = null;

function showResults(data) {
  current = data;
  $('results').hidden = !data;
  $('empty').hidden = !!data;
  if (!data) return;

  $('stat-count').textContent = data.rows.length;
  $('stat-time').textContent = data.elapsed_s + ' s';
  $('stat-mem').textContent = data.peak_mem_mb + ' MB';
  $('annotated').src = data.annotated;
  $('dl-image').href = data.annotated;

  $('rows').replaceChildren(...data.rows.map(row => {
    const tr = document.createElement('tr');
    for (const col of COLUMNS) tr.append(el('td', { textContent: row[col] ?? '–' }));
    return tr;
  }));
}

const csvCell = v => {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};

$('dl-csv').addEventListener('click', () => {
  const lines = [COLUMNS, ...current.rows.map(r => COLUMNS.map(c => r[c]))].map(r => r.map(csvCell).join(','));
  const link = el('a', {
    href: URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })),
    download: (state.file.name.replace(/\.[^.]+$/, '') || 'result') + '.csv',
  });
  link.click();
  URL.revokeObjectURL(link.href);
});

buildRegionControls();
refresh();
</script>
</body>
</html>
